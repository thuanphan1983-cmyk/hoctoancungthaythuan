    // ==========================================

    function safeParseJSON(rawText) {

      if (!rawText || typeof rawText !== "string") {

        throw new Error("Dữ liệu phản hồi từ AI rỗng.");

      }



      let clean = rawText

        .replace(/^```json\s*/i, "")

        .replace(/^```\s*/i, "")

        .replace(/```\s*$/i, "")

        .trim();



      try {

        return JSON.parse(clean);

      } catch (err1) {

        try {

          // Thoát tất cả dấu gạch chéo ngược LaTeX (\frac, \sqrt, \neq, \alpha, ...)

          const fixed = clean.replace(/\\(?!["\\])/g, "\\\\");

          return JSON.parse(fixed);

        } catch (err2) {

          const match = clean.match(/\{[\s\S]*\}/);

          if (match) {

            const fixedMatch = match[0].replace(/\\(?!["\\])/g, "\\\\");

            return JSON.parse(fixedMatch);

          }

          throw new Error(`Lỗi cú pháp JSON: ${err1.message}`);

        }

      }

    // Giúp Vision API nhận diện tức thì, không bị lỗi 413, không tràn LocalStorage

    // ==========================================

    function compressImage(file, maxWidth = 1600, quality = 0.85) {

      return new Promise((resolve, reject) => {

        if (!file) return resolve(null);

        const reader = new FileReader();

        reader.onload = (event) => {

          const img = new Image();

          img.onload = () => {

            let width = img.width;

            let height = img.height;

            if (width > maxWidth || height > maxWidth) {

              if (width > height) {

                height = Math.round((height * maxWidth) / width);

                width = maxWidth;

              } else {

                width = Math.round((width * maxWidth) / height);

                height = maxWidth;

              }

            }

            const canvas = document.createElement("canvas");

            canvas.width = width;

            canvas.height = height;

            const ctx = canvas.getContext("2d");

            ctx.fillStyle = "#FFFFFF";

            ctx.fillRect(0, 0, width, height);

            ctx.drawImage(img, 0, 0, width, height);

            const dataUrl = canvas.toDataURL("image/jpeg", quality);

            resolve(dataUrl);

          };

          img.onerror = () => resolve(event.target.result);

          img.src = event.target.result;

        };

        reader.onerror = reject;

        reader.readAsDataURL(file);

      });

    }

                { left: "$", right: "$", display: false },

                { left: "\\[", right: "\\]", display: true },

                { left: "\\(", right: "\\)", display: false }

              ],

              throwOnError: false

            });

          }

          console.warn("KaTeX render error:", e);

        }

          .replace(/</g, "&lt;")

          .replace(/>/g, "&gt;");

      }, [text]);



      const Tag = block ? "div" : "span";

      return <Tag ref={containerRef} className={className} style={{ whiteSpace: "pre-wrap" }} dangerouslySetInnerHTML={{ __html: formatted }} />;

    // ==========================================

    // ==============================================================================
    // HỆ THỐNG TẢI DỮ LIỆU ĐỀ THI ĐỘNG (DYNAMIC FETCH / IMPORT) TỪ MANIFEST.JSON
    // 1. Tự động fetch() file JSON của đúng chương khi người dùng chọn bài học
    // 2. Tra cứu qua manifest.json để nắm toàn bộ kho đề
    // 3. BỎ HOÀN TOÀN FALLBACK: Nếu không tìm thấy đề, trả về null để báo lỗi rõ ràng,
    //    tuyệt đối KHÔNG bù đề của chương khác (đơn thức/đa thức).
    // ==============================================================================

    const DYNAMIC_EXAM_CACHE = {}; // Cache theo chapterKey: `grade{grade}_{chapterId}`
    let DYNAMIC_MANIFEST_CACHE = null;

    // 1. Hàm tải manifest.json
    async function loadExamManifest() {
      if (DYNAMIC_MANIFEST_CACHE) return DYNAMIC_MANIFEST_CACHE;
      const candidateUrls = [
        "manifest.json",
        "generated/manifest.json",
        "src/data/generated/manifest.json",
        "./manifest.json",
        "./generated/manifest.json",
        "./src/data/generated/manifest.json"
      ];
      for (const url of candidateUrls) {
        try {
          const resp = await fetch(url, { cache: "no-cache" });
          if (resp.ok) {
            const data = await resp.json();
            DYNAMIC_MANIFEST_CACHE = data;
            console.log("SUCCESS: Loaded manifest.json from:", url, Object.keys(data));
            return DYNAMIC_MANIFEST_CACHE;
          }
        } catch (e) {
          // Thu duong dan tiep theo
        }
      }
      return null;
    }

    // 2. Hàm tải động dữ liệu của một chương
    async function fetchChapterExams(grade, chapterId) {
      const gStr = String(grade);
      const chKey = `grade${gStr}_${chapterId}`;
      if (DYNAMIC_EXAM_CACHE[chKey]) {
        return DYNAMIC_EXAM_CACHE[chKey];
      }

      const manifest = await loadExamManifest();
      let jsonFileName = `grade${gStr}_${chapterId}_exams.json`;
      let jsFileName = `grade${gStr}_${chapterId}_exams.js`;

      if (manifest && manifest[chKey]) {
        jsonFileName = manifest[chKey].jsonFile || jsonFileName;
        jsFileName = manifest[chKey].jsFile || jsFileName;
      }

      const jsonCandidateUrls = [
        `generated/${jsonFileName}`,
        `src/data/generated/${jsonFileName}`,
        `${jsonFileName}`,
        `./generated/${jsonFileName}`,
        `./src/data/generated/${jsonFileName}`,
        `./${jsonFileName}`
      ];

      // Phương pháp 1: Dynamic fetch() file JSON
      for (const url of jsonCandidateUrls) {
        try {
          const resp = await fetch(url, { cache: "no-cache" });
          if (resp.ok) {
            const data = await resp.json();
            const examsDict = data.exams || data;
            if (examsDict && typeof examsDict === "object" && Object.keys(examsDict).length > 0) {
              DYNAMIC_EXAM_CACHE[chKey] = examsDict;
              console.log(`SUCCESS [Dynamic Fetch]: Loaded data for ${chKey} from: ${url} (${Object.keys(examsDict).length} exams)`);
              return examsDict;
            }
          }
        } catch (e) {
          // Thu tiep
        }
      }

      // Phương pháp 2: Fallback qua window global (nếu đã có sẵn trong trang)
      const globalVarNames = [
        `CHAPTER${chapterId.replace(/[^0-9]/g, '')}_TOAN${gStr}_EXAMS`,
        `EXAMS_${gStr.toUpperCase()}_${chapterId.toUpperCase()}`,
        `CHAPTER${chapterId.replace(/[^0-9]/g, '')}_TOAN8_EXAMS`
      ];
      for (const gv of globalVarNames) {
        if (typeof window !== "undefined" && window[gv]) {
          const examsDict = window[gv].exams || window[gv];
          DYNAMIC_EXAM_CACHE[chKey] = examsDict;
          return examsDict;
        }
      }

      // Phương pháp 3: Dynamic Script Injection (cho môi trường file:/// khi fetch bị CORS chặn)
      const jsCandidateUrls = [
        `generated/${jsFileName}`,
        `src/data/generated/${jsFileName}`,
        `${jsFileName}`,
        `chapter${chapterId.replace(/[^0-9]/g, '')}Toan${gStr}Exams.js`
      ];
      for (const jsUrl of jsCandidateUrls) {
        try {
          await new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = jsUrl;
            script.onload = () => resolve();
            script.onerror = () => reject();
            document.head.appendChild(script);
          });
          for (const gv of globalVarNames) {
            if (typeof window !== "undefined" && window[gv]) {
              const examsDict = window[gv].exams || window[gv];
              DYNAMIC_EXAM_CACHE[chKey] = examsDict;
              return examsDict;
            }
          }
        } catch (e) {
          // Thu tiep
        }
      }

      console.warn(`WARNING [Dynamic Fetch]: Not found exam data for ${chKey}`);
      return null;
    }

    // 3. Hàm lấy đề thi cho bài học cụ thể
    // QUY TẮC RÀNG BUỘC: Nếu không tìm thấy, trả về NULL. Tuyệt đối KHÔNG fallback sang chương khác!
    async function getExamForLesson(grade, chapterId, lessonName, testNum = 1) {
      const examsDict = await fetchChapterExams(grade, chapterId);
      if (!examsDict) {
        // Chưa có dữ liệu: trả về null để giao diện hiển thị thông báo "Đề thi đang được cập nhật"
        return null;
      }

      const curChap = (window.CURRICULUM_KNTT || {})[grade]?.chapters.find(c => c.id === chapterId);
      const lessonIdx = curChap && curChap.lessons ? (curChap.lessons.indexOf(lessonName) + 1) : 0;

      // Ưu tiên 1: Khớp theo index chuẩn {chapterId}_bai{idx}_test{testNum}
      if (lessonIdx > 0) {
        const standardKey = `${chapterId}_bai${lessonIdx}_test${testNum}`;
        if (examsDict[standardKey]) {
          return examsDict[standardKey];
        }
      }

      // Ưu tiên 2: Khớp theo từ khóa bài học
      const les = (lessonName || "").toLowerCase();
      for (const [key, exam] of Object.entries(examsDict)) {
        if (key.endsWith(`_test${testNum}`)) {
          const title = (exam.title || "").toLowerCase();
          const matchBai = les.match(/bài\s*(\d+)/i);
          if (matchBai) {
            const num = matchBai[1];
            if (title.includes(`bài ${num}`) || title.includes(`bai ${num}`) || key.includes(`bai${num}`)) {
              return exam;
            }
          }
          if (les.includes("cuối chương") && (title.includes("cuối chương") || key.includes("bai6") || key.includes("bai8") || key.includes("bai5"))) {
            return exam;
          }
          if (les.includes("ôn tập") && (title.includes("ôn tập") || key.includes("bai6") || key.includes("bai8"))) {
            return exam;
          }
        }
      }

      // Ưu tiên 3: Nếu là bài trong chương nhưng key đặt theo thứ tự danh sách đề
      const candidateKeys = Object.keys(examsDict).filter(k => k.endsWith(`_test${testNum}`));
      if (lessonIdx > 0 && candidateKeys[lessonIdx - 1]) {
        return examsDict[candidateKeys[lessonIdx - 1]];
      }

      // NẾU VẪN KHÔNG TÌM THẤY: BỎ TOÀN BỘ CƠ CHẾ LẤY ĐỀ CŨ BÙ VÀO, TRẢ VỀ NULL!
      return null;
    }

    // Giữ hàm getExamFromBank đồng bộ cho các ngữ cảnh kiểm tra nhanh từ cache
    function getExamFromBank(grade, chapterId, lessonName, testNum = 1) {
      const gStr = String(grade);
      const chKey = `grade${gStr}_${chapterId}`;
      const cached = DYNAMIC_EXAM_CACHE[chKey];
      if (!cached) return null; // Tuyệt đối KHÔNG fallback sang chương khác!
      const curChap = (window.CURRICULUM_KNTT || {})[grade]?.chapters.find(c => c.id === chapterId);
      const lessonIdx = curChap && curChap.lessons ? (curChap.lessons.indexOf(lessonName) + 1) : 0;
      if (lessonIdx > 0 && cached[`${chapterId}_bai${lessonIdx}_test${testNum}`]) {
        return cached[`${chapterId}_bai${lessonIdx}_test${testNum}`];
      }
      return null;
    }

Bạn là giám khảo chấm thi môn Toán THCS có kinh nghiệm chấm thi học sinh giỏi và kỳ thi tuyển sinh vào lớp 10.

Nhiệm vụ: Hãy đọc ảnh chụp bài làm tự luận viết tay của học sinh, đối chiếu đề bài và biểu điểm chuẩn (Rubric), sau đó chấm điểm và nhận xét chi tiết theo chuẩn Bộ Giáo dục & Đào tạo.



ĐỀ BÀI CÂU ${q.id} (Mức độ: ${q.level} - Thang điểm tối đa: 1.0 điểm):

"${q.question}"



BIỂU ĐIỂM CHUẨN CỦA BỘ GD&ĐT (TỔNG 1.0 ĐIỂM):

"${q.rubric}"



HÃY PHÂN TÍCH ẢNH VÀ CHẤM THEO QUY TRÌNH CHUẨN:

1. Nhận diện chữ viết tay và công thức toán học của học sinh trong ảnh (OCR):

   - Đọc từng dòng chữ viết tay, phép tính, biến đổi đại số, lập luận hình học.

   - Nếu trong ảnh chụp có nhiều câu, hãy tìm đúng phần bài làm của Câu ${q.id}.

   - Nếu ảnh không chứa lời giải của câu này hoặc chữ viết quá mờ không thể đọc, hãy cho 0 điểm và ghi rõ lý do.

2. Chia biểu điểm 1.0 điểm thành các bước nhỏ chuẩn barem (bước 0.25đ hoặc 0.5đ):

   - Barem chấm điểm câu 1.0 điểm của Bộ GD&ĐT thường chia thành 3 hoặc 4 bước chấm (mỗi bước 0.25đ hoặc 0.5đ).

3. Đánh giá tính đúng/sai của từng bước:

   - Học sinh làm đúng đến đâu thì cho điểm tối đa của bước đó.

   - Nếu sai ở bước nào thì không cho điểm bước đó và các bước kế tiếp phụ thuộc vào bước sai đó.

   - Điểm tổng của câu PHẢI là một trong các mức chuẩn: 0, 0.25, 0.5, 0.75, hoặc 1.0 điểm.

4. Trả về lời giải mẫu chuẩn hoàn chỉnh từng bước có công thức LaTeX để học sinh đối chiếu.



TRẢ VỀ ĐÚNG ĐỊNH DẠNG JSON SAU (không kèm markdown ngoài JSON):

{

  "ocrText": "Trích dẫn nguyên văn hoặc tóm lược các bước học sinh đã viết trong ảnh (dùng LaTeX bọc trong $ cho biểu thức toán)",

  "score": 0.75,

  "steps": [

    {

      "step": "Bước 1: Nêu điều kiện xác định / thiết lập giả thiết (0.25đ)",

      "awarded": 0.25,

      "max": 0.25,

      "status": "Đúng",

      "note": "Xác định đúng điều kiện..."

      "awarded": 0.25,

      "max": 0.50,

      "status": "Sai một phần",

      "note": "Nhầm dấu ở dòng..."

    },

    {

      "step": "Bước 3: Kết luận nghiệm và đối chiếu (0.25đ)",

      "awarded": 0.25,

      "max": 0.25,

      "status": "Đúng",

      "note": "Đối chiếu và kết luận đúng."

  ],

  "mistakes": "Chỉ rõ cụ thể lỗi sai trong bài làm (nếu có)",

  "modelSolution": "Lời giải mẫu hoàn chỉnh từng bước với công thức LaTeX chuẩn..."

}`;



            let graded = false;

            for (const model of CANDIDATE_MODELS) {

              try {

                const res = await fetch(

                  `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${cleanKey}`,

                  {

                    method: "POST",

                    headers: { "Content-Type": "application/json" },

                    body: JSON.stringify({

                      contents: [{

                        parts: [

                          { text: visionPrompt },

                          { inlineData: { mimeType, data: base64Data } }

                        ]

                      }],

                      generationConfig: {

                        responseMimeType: "application/json",

                        temperature: 0.2

                      }

                    })

                  }

                );



                if (!res.ok) {

                  const errText = await res.text();

                  console.warn(`Vision model ${model} HTTP ${res.status}:`, errText);

                  continue;

                }



                const visionJson = await res.json();

                const rawVision = visionJson?.candidates?.[0]?.content?.parts?.[0]?.text || "{}";

                const parsedVision = safeParseJSON(rawVision);



                let awarded = Number(parsedVision.score);

                if (isNaN(awarded)) awarded = 0;

                awarded = Math.round(awarded * 4) / 4;

                awarded = Math.min(1.0, Math.max(0, awarded));



                scorePart4 += awarded;

                essayFeedbacks[q.id] = {

                  score: awarded,

                  ocrText: parsedVision.ocrText || "Đã nhận diện bài làm viết tay của học sinh.",

                  steps: Array.isArray(parsedVision.steps) ? parsedVision.steps : [],

                  mistakes: parsedVision.mistakes || "",

                  comment: parsedVision.comment || "Đã chấm theo barem chuẩn của Bộ GD&ĐT.",

                  modelSolution: parsedVision.modelSolution || q.rubric,

                  usedImage: imgDataUrl

                };

                graded = true;

                break;

              } catch (e) {

                console.warn(`Thử model kế tiếp do lỗi Vision:`, e);

              }

            }

                        <div className="border-b pb-3 flex justify-between items-center">
                          <div>
                            <h3 className="text-base font-black text-indigo-950 uppercase">
                              II. PHẦN TỰ LUẬN (8,0 điểm)
                            </h3>
                            <p className="text-xs text-slate-500 mt-0.5">
                              Thí sinh tự giải ra giấy và đối chiếu lời giải chi tiết kèm thang điểm.
                            </p>
                          </div>
                          <button
                            onClick={() => setShowMockSolution(!showMockSolution)}
                            className="text-xs font-bold text-indigo-600 hover:text-indigo-800 bg-indigo-50 px-3 py-1.5 rounded-lg border border-indigo-200"
                          >
                            {showMockSolution ? "Ẩn Barem Lời giải" : "Xem Barem Lời giải"}
                          </button>
                        </div>

                        <div className="space-y-6">
                          {currentExam.part2.map((q) => (
                            <div key={q.id} className="p-5 rounded-2xl border border-slate-200 bg-slate-50/40 space-y-3">
                              <h4 className="font-bold text-sm md:text-base text-slate-900 leading-relaxed">
                                <span className="text-indigo-700 font-black">Câu {q.id} ({q.points.toFixed(1)} điểm).</span>
                              </h4>
                              <div className="text-xs md:text-sm text-slate-800 leading-relaxed font-serif text-[13pt]">
                                <MathView text={q.question} />
                              </div>

                              {showMockSolution && (
                                <div className="mt-3 p-4 bg-emerald-50/70 border border-emerald-200 rounded-xl space-y-3">
                                  <div className="font-black text-xs text-emerald-900 flex items-center gap-1.5 uppercase tracking-wider">
                                    <span>📘</span> Lời giải chi tiết & Barem:
                                  </div>
                                  <div className="text-xs text-slate-800 leading-relaxed space-y-2">
                                    <MathView text={q.solution} />
                                  </div>
                                  {q.rubric && (
                                    <div className="mt-2 border-t border-emerald-200 pt-2 space-y-1">
                                      <div className="text-[11px] font-bold text-emerald-950">Barem điểm chấm thi:</div>
                                      {q.rubric.map((r, rIdx) => (
                                        <div key={rIdx} className="text-[11px] text-slate-600 flex justify-between gap-2 border-b border-emerald-100 pb-1">
                                          <span>• {r.step}</span>
                                          <span className="font-bold text-emerald-800 shrink-0">+{r.points}đ</span>
                                        </div>
                                      ))}
                                    </div>
                                  )}
                                </div>
                              )}
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              );
            })()}

            {view === "dashboard" && (

              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-6">

                <div className="flex flex-wrap justify-between items-center gap-4 border-b pb-4">

                  <div>

                    <h2 className="text-xl font-bold text-slate-900">

                      Bảng Thống kê Kết quả Học tập theo Lớp

                    </h2>

                    <p className="text-xs md:text-sm text-slate-500 mt-0.5">

                      Bộ lọc lớp, điểm trung bình, phân loại năng lực và xuất file Excel / CSV đầy đủ nhận xét 4 phần

                    </p>

                  </div>



                  <div className="flex flex-wrap items-center gap-2 no-print">

                    <button

                      onClick={handleExportExcel}

                      className="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow"

                    >

                      <Icons.FileSpreadsheet /> Xuất Excel (.xlsx)

                    </button>

                    <button

                      onClick={handleExportCSV}

                      className="bg-teal-600 hover:bg-teal-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow"

                    >

                      <Icons.Download /> Xuất CSV

                    </button>

                    {submissions.length > 0 && (

                      <button

                        onClick={() => {

                          if (window.confirm("Thầy/Cô có chắc chắn muốn xóa toàn bộ lịch sử điểm số đã lưu?")) {

                            setSubmissions([]);

                            localStorage.removeItem("MATH_SUBMISSIONS_KNTT");

                          }

                        }}

                        className="bg-rose-50 text-rose-600 hover:bg-rose-100 px-3 py-2 rounded-xl text-xs font-bold border border-rose-200 transition flex items-center gap-1"

                      >

                        Xóa lịch sử

                      </button>

                    )}

                  </div>

                </div>



                {/* Thống kê nhanh */}

                {classStats && (

                  <div className="grid grid-cols-2 md:grid-cols-5 gap-3">

                    <div className="bg-indigo-50 border border-indigo-200 p-3.5 rounded-xl text-center">

                      <div className="text-xs text-indigo-700 font-bold uppercase">Điểm TB Lớp</div>

                      <div className="text-2xl font-black text-indigo-950 mt-1">{classStats.avg}</div>

                    </div>

                    <div className="bg-emerald-50 border border-emerald-200 p-3.5 rounded-xl text-center">

                      <div className="text-xs text-emerald-700 font-bold uppercase">Giỏi (≥ 8.0)</div>

                      <div className="text-2xl font-black text-emerald-800 mt-1">{classStats.gioi} <span className="text-xs font-normal">({Math.round((classStats.gioi / classStats.count) * 100)}%)</span></div>

                    </div>

                    <div className="bg-blue-50 border border-blue-200 p-3.5 rounded-xl text-center">

                      <div className="text-xs text-blue-700 font-bold uppercase">Khá (6.5 - 7.9)</div>

                      <div className="text-2xl font-black text-blue-800 mt-1">{classStats.kha} <span className="text-xs font-normal">({Math.round((classStats.kha / classStats.count) * 100)}%)</span></div>

                    </div>

                    <div className="bg-amber-50 border border-amber-200 p-3.5 rounded-xl text-center">

                      <div className="text-xs text-amber-700 font-bold uppercase">Đạt (5.0 - 6.4)</div>

                      <div className="text-2xl font-black text-amber-800 mt-1">{classStats.dat} <span className="text-xs font-normal">({Math.round((classStats.dat / classStats.count) * 100)}%)</span></div>

                    </div>

                    <div className="bg-rose-50 border border-rose-200 p-3.5 rounded-xl text-center">

                      <div className="text-xs text-rose-700 font-bold uppercase">Chưa đạt (&lt; 5.0)</div>

                      <div className="text-2xl font-black text-rose-800 mt-1">{classStats.chuaDat} <span className="text-xs font-normal">({Math.round((classStats.chuaDat / classStats.count) * 100)}%)</span></div>

                    </div>

                  </div>

                )}



                {/* Bộ lọc theo lớp */}

                <div className="flex flex-wrap items-center gap-3 bg-slate-50 p-3.5 rounded-xl border border-slate-200 text-xs">

                  <span className="font-bold text-slate-700">Lọc theo Lớp học:</span>

                  <button

                    onClick={() => setFilterClass("ALL")}

                    className={`px-3 py-1.5 rounded-lg font-semibold transition ${

                      filterClass === "ALL"

                        ? "bg-indigo-600 text-white"

                        : "bg-white text-slate-700 border border-slate-300 hover:bg-slate-100"

                    }`}

                  >

                    Tất cả ({submissions.length})

                  </button>

                  {uniqueClasses.map((cls) => {

                    const count = submissions.filter(s => s.className === cls).length;

                    return (

                      <button

                        key={cls}

                        onClick={() => setFilterClass(cls)}

                        className={`px-3 py-1.5 rounded-lg font-semibold transition ${

                          filterClass === cls

                            ? "bg-indigo-600 text-white"

                            : "bg-white text-slate-700 border border-slate-300 hover:bg-slate-100"

                        }`}

                      >

                        Lớp {cls} ({count})

                      </button>

                    );

                  })}

                </div>



                {getFilteredSubmissions().length === 0 ? (

                  <div className="text-center py-12 text-slate-400 text-sm">

                    Chưa có dữ liệu bài làm nào được ghi nhận cho lớp này.

                  </div>

                ) : (

                  <div className="overflow-x-auto">

                    <table className="w-full text-left border-collapse text-xs md:text-sm">

                      <thead>

                        <tr className="bg-slate-100 text-slate-700 text-[11px] uppercase font-bold">

                          <th className="p-3 border">Lớp</th>

                          <th className="p-3 border">Họ tên Học sinh</th>

                          <th className="p-3 border text-center">Khối</th>

                          <th className="p-3 border">Bài học & Đề</th>

                          <th className="p-3 border text-center">P.I (3đ)</th>

                          <th className="p-3 border text-center">P.II (2đ)</th>

                          <th className="p-3 border text-center">P.III (2đ)</th>

                          <th className="p-3 border text-center">P.IV (3đ)</th>

                          <th className="p-3 border text-center">Tổng</th>

                          <th className="p-3 border text-center">Xếp loại</th>

                          <th className="p-3 border">Đánh giá chung</th>

                        </tr>

                      </thead>

                      <tbody>

                        {getFilteredSubmissions().map((sub) => (

                          <tr key={sub.id} className="hover:bg-slate-50 transition">

                            <td className="p-3 border font-bold text-indigo-700">{sub.className}</td>

                            <td className="p-3 border font-medium text-slate-900">{sub.studentName}</td>

                            <td className="p-3 border text-center">Toán {sub.grade}</td>

                            <td className="p-3 border text-xs">

                              <div className="font-medium text-slate-800">{sub.lesson}</div>

                              <span className="text-indigo-600 font-semibold">Bài KT số {sub.testNum}</span>

                            </td>

                            <td className="p-3 border text-center">{sub.scorePart1}</td>

                            <td className="p-3 border text-center">{sub.scorePart2}</td>

                            <td className="p-3 border text-center">{sub.scorePart3}</td>

                            <td className="p-3 border text-center">{sub.scorePart4}</td>

                            <td className="p-3 border text-center font-bold text-emerald-700 text-sm">{sub.totalScore}</td>

                            <td className="p-3 border text-center">

                              <span className={`px-2 py-0.5 rounded font-bold text-[11px] ${

                                sub.totalScore >= 8 ? "bg-emerald-100 text-emerald-800" :

                                sub.totalScore >= 6.5 ? "bg-blue-100 text-blue-800" :

                                sub.totalScore >= 5 ? "bg-amber-100 text-amber-800" : "bg-rose-100 text-rose-800"

                              }`}>

                                {sub.totalScore >= 8 ? "Giỏi" : sub.totalScore >= 6.5 ? "Khá" : sub.totalScore >= 5 ? "Đạt" : "Chưa đạt"}

                              </span>

                            </td>

                            <td className="p-3 border text-xs text-slate-600 max-w-xs">{sub.feedbacks?.overall || sub.overallTeacherComment}</td>

                          </tr>

                        ))}

                      </tbody>

                    </table>

                  </div>

                )}

              </div>

            )}

          

          {/* MODAL PHÓNG TO ẢNH BÀI LÀM VIẾT TAY */}

          {zoomImage && (

            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4" onClick={() => setZoomImage(null)}>

              <div className="relative max-w-4xl max-h-[90vh] bg-white rounded-2xl p-3 shadow-2xl overflow-hidden" onClick={e => e.stopPropagation()}>

                <div className="flex justify-between items-center p-2 border-b">

                  <span className="text-xs font-bold text-slate-800 flex items-center gap-1.5">

                    <Icons.Camera /> Xem ảnh bài làm viết tay học sinh

                  </span>

                  <button onClick={() => setZoomImage(null)} className="p-1 rounded-lg hover:bg-slate-100 text-slate-500 font-bold text-sm">

                    ✕ Đóng

                  </button>

                </div>

                <div className="overflow-auto max-h-[80vh] flex items-center justify-center p-2 bg-slate-900/5">

                  <img src={zoomImage} alt="Bài làm viết tay phóng to" className="max-w-full max-h-full object-contain rounded-lg shadow-sm" />

                </div>

              </div>

            </div>

          )}



          {/* MODAL MỞ CAMERA CHỤP TRỰC TIẾP */}

          {cameraActiveModal && (

            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">

              <div className="relative w-full max-w-xl bg-white rounded-2xl p-5 shadow-2xl space-y-4">

                <div className="flex justify-between items-center border-b pb-3">

                  <h3 className="font-bold text-base text-slate-900 flex items-center gap-2">

                    <Icons.Camera /> Chụp ảnh bài làm viết tay {cameraActiveModal === 'shared' ? '(Cả 3 câu Tự luận)' : `(Câu ${cameraActiveModal})`}

                  </h3>

                  <button onClick={stopCamera} className="text-slate-400 hover:text-slate-700 font-bold text-lg">✕</button>

                </div>

                <div className="relative bg-black rounded-xl overflow-hidden aspect-[4/3] flex items-center justify-center">

                  <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover"></video>

                </div>

                <div className="flex justify-between items-center pt-2">

                  <button onClick={stopCamera} className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition">

                    Hủy bỏ

                  </button>

                  <button onClick={captureCameraFrame} className="px-6 py-2.5 rounded-xl text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 shadow flex items-center gap-2 transition">

                    <Icons.Camera /> Chụp & Dùng ảnh này

                  </button>

                </div>

              </div>

            </div>

          )}



          {/* OVERLAY TIẾN ĐỘ CHẤM BÀI AI VISION */}

          {loadingAI && gradingProgress && (

            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">

              <div className="bg-white rounded-2xl p-6 shadow-2xl max-w-md w-full text-center space-y-4">

                <div className="w-14 h-14 mx-auto rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center animate-spin">

                  <Icons.RefreshCw />

                </div>

                <div>

                  <h4 className="font-bold text-slate-900 text-base">Hệ thống đang chấm bài thi</h4>

                  <p className="text-xs text-indigo-700 font-semibold mt-1.5 animate-pulse">

                    {gradingProgress}

                  </p>

                </div>

                <div className="text-[11px] text-slate-500 bg-slate-50 p-2.5 rounded-lg border border-slate-200">

                  AI Vision đang phân tích ảnh chụp, đọc từng dòng chữ viết tay, đối chiếu barem điểm chuẩn của Bộ GD&ĐT. Vui lòng chờ trong giây lát...

                </div>

              </div>

            </div>

          )}



          {/* TOAST THÔNG BÁO DỰ PHÒNG & TRẠNG THÁI */}

          {toast && (

            <div className="fixed top-5 right-5 z-[9999] max-w-md w-full animate-bounce">

              <div className={`p-4 rounded-xl shadow-2xl border flex items-start gap-3 ${

                toast.type === "warning"

                  ? "bg-amber-50 border-amber-300 text-amber-900"

                  : toast.type === "success"

                  ? "bg-emerald-50 border-emerald-300 text-emerald-900"

                  : "bg-blue-50 border-blue-300 text-blue-900"

              }`}>

                <div className="shrink-0 mt-0.5 text-lg">

                  {toast.type === "warning" ? "⚠️" : toast.type === "success" ? "✅" : "ℹ️"}

                </div>

                <div className="flex-1 text-xs leading-relaxed font-medium">

                  {toast.message}

                </div>

                <button

                  onClick={() => setToast(null)}

                  className="shrink-0 text-slate-400 hover:text-slate-700 font-bold text-sm leading-none"

                >

                  ✕

                </button>

              </div>

            </div>

          )}



          {/* MODAL YÊU CẦU NHẬP KEY CHO SINH ĐỀ AI */}

          {showKeyModal && (

            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">

              <div className="bg-white rounded-2xl p-6 shadow-2xl max-w-lg w-full space-y-4 border border-slate-100">

                <div className="flex justify-between items-start">

                  <div className="flex items-center gap-2">

                    <div className="w-10 h-10 rounded-xl bg-purple-100 text-purple-700 flex items-center justify-center font-bold">

                      <Icons.Sparkles />

                    </div>

                    <div>

                      <h3 className="font-bold text-base text-slate-900">Kích hoạt Sinh đề AI Cá nhân hóa</h3>

                      <p className="text-xs text-slate-500">Google Gemini AI biên soạn bộ đề mới hoàn toàn</p>

                    </div>

                  </div>

                  <button

                    onClick={() => setShowKeyModal(false)}

                    className="text-slate-400 hover:text-slate-600 font-bold text-lg"

                  >

                    ✕

                  </button>

                </div>



                <div className="bg-purple-50/70 p-3.5 rounded-xl border border-purple-200/60 text-xs text-purple-900 space-y-2">

                  <p>

                    Để sử dụng trí tuệ nhân tạo Gemini tự động biên soạn bộ đề mới độc lập, em vui lòng cung cấp mã <b>Google Gemini API Key</b> (miễn phí từ Google AI Studio).

                  </p>

                  <p className="text-slate-600">

                    💡 <i>Nếu không có mã Key, em có thể bấm <b>"Làm bài ngay (Đề Chuẩn)"</b> hoàn toàn miễn phí và không cần nhập bất kỳ mã nào!</i>

                  </p>

                </div>



                <div className="space-y-1.5">

                  <label className="text-xs font-bold text-slate-700">Gemini API Key của em:</label>

                  <input

                    type="password"

                    placeholder="Dán mã AIzaSy... vào đây"

                    value={tempKeyInput}

                    onChange={(e) => setTempKeyInput(e.target.value)}

                    className="w-full text-xs border border-slate-300 rounded-xl px-3.5 py-2.5 focus:ring-2 focus:ring-purple-500 outline-none bg-slate-50"

                  />

                  <div className="text-[11px] text-slate-400">

                    Key được lưu trực tiếp và an toàn trên trình duyệt (localStorage), không lưu trữ trên máy chủ khác.

                  </div>

                </div>



                <div className="flex flex-col sm:flex-row justify-end items-stretch sm:items-center gap-2 pt-2">

                  <button

                    onClick={() => {

                      setShowKeyModal(false);

                      handleStartStandardExam(false);

                    }}

                    className="px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 transition text-center"

                  >

                    Làm Đề Chuẩn (Không cần Key)

                  </button>

                  <button

                    onClick={() => {

                      const trimmed = tempKeyInput.trim();

                      if (!trimmed) {

                        alert("Vui lòng dán mã Gemini API Key trước khi kích hoạt!");

                        return;

                      }

                      saveApiKey(trimmed);

                      setShowKeyModal(false);

                      generateExamWithAI(trimmed);

                    }}

                    className="px-5 py-2.5 rounded-xl text-xs font-bold text-white bg-purple-600 hover:bg-purple-700 shadow-md flex items-center justify-center gap-1.5 transition"

                  >

                    <Icons.Sparkles /> Lưu Key & Bắt đầu sinh đề AI

                  </button>

                </div>

              </div>

            </div>

          )}



          {/* MODAL YÊU CẦU NHẬP KEY CHO CHẤM TỰ LUẬN AI VISION */}

          {showEssayKeyModal && (

            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">

              <div className="bg-white rounded-2xl p-6 shadow-2xl max-w-lg w-full space-y-4 border border-slate-100">

                <div className="flex justify-between items-start">

                  <div className="flex items-center gap-2">

                    <div className="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold">

                      <Icons.Camera />

                    </div>

                    <div>

                      <h3 className="font-bold text-base text-slate-900">Kích hoạt Chấm Tự luận AI Vision</h3>

                      <p className="text-xs text-slate-500">Đọc ảnh chữ viết tay & chấm điểm chi tiết</p>

                    </div>

                  </div>

                  <button

                    onClick={() => setShowEssayKeyModal(false)}

                    className="text-slate-400 hover:text-slate-600 font-bold text-lg"

                  >

                    ✕

                  </button>

                </div>



                <div className="bg-indigo-50/70 p-3.5 rounded-xl border border-indigo-200/60 text-xs text-indigo-900 space-y-2">

                  <p>

                    Em đã tải ảnh chụp bài làm tự luận viết tay. Để mô hình <b>Gemini Vision</b> đọc ảnh và chấm chi tiết từng bước theo barem Bộ GD&ĐT, hệ thống cần Gemini API Key.

                  </p>

                  <p className="text-slate-600">

                    💡 <i>Nếu chưa có Key, em vẫn có thể tiếp tục nộp bài. Hệ thống sẽ hiển thị lời giải và biểu điểm chi tiết để em tự đối chiếu!</i>

                  </p>

                </div>



                <div className="space-y-1.5">

                  <label className="text-xs font-bold text-slate-700">Dán Gemini API Key để chấm Vision:</label>

                  <input

                    type="password"

                    placeholder="Dán mã AIzaSy... vào đây"

                    value={tempKeyInput}

                    onChange={(e) => setTempKeyInput(e.target.value)}

                    className="w-full text-xs border border-slate-300 rounded-xl px-3.5 py-2.5 focus:ring-2 focus:ring-indigo-500 outline-none bg-slate-50"

                  />

                </div>



                <div className="flex flex-col sm:flex-row justify-end items-stretch sm:items-center gap-2 pt-2">

                  <button

                    onClick={() => {

                      setShowEssayKeyModal(false);

                      handleSubmitExam(true);

                    }}

                    className="px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 transition text-center"

                  >

                    Tiếp tục không cần Key (Xem Barem)

                  </button>

                  <button

                    onClick={() => {

                      const trimmed = tempKeyInput.trim();

                      if (!trimmed) {

                        alert("Vui lòng dán mã Gemini API Key!");

                        return;

                      }

                      saveApiKey(trimmed);

                      setShowEssayKeyModal(false);

                      handleSubmitExam(true);

                    }}

                    className="px-5 py-2.5 rounded-xl text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 shadow-md flex items-center justify-center gap-1.5 transition"

                  >

                    <Icons.CheckCircle /> Lưu Key & Chấm AI Vision

                  </button>

                </div>

              </div>

            </div>

          )}



        </main>

        </div>

      );

    }



    ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>

</body>

</html>
